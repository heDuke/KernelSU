name: Build ksud
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_ksuinit:
        required: false
        type: boolean
        default: false
      use_pr_package:
        description: 'Embed me.weishu.kernelsu.pr as manager package name'
        required: false
        type: boolean
        default: false
      manager_package:
        description: 'Manager applicationId embedded in ksud (overrides use_pr_package when set)'
        required: false
        type: string
        default: ''
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/aarch64/
        cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/ksud/bin/x86_64/
    
    - name: Prepare ksuinit
      if: ${{ inputs.pack_ksuinit }}
      run: |
        mv ksuinit-aarch64/ksuinit ./userspace/ksud/bin/aarch64/
        mv ksuinit-x86_64/ksuinit ./userspace/ksud/bin/x86_64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        rustup target add ${{ inputs.target }}

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/ksud
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Install Android check tool
      if: inputs.target == 'aarch64-linux-android'
      run: cargo install cargo-ndk --version 4.1.2 --locked

    - name: Check Android compilation, lints and format
      if: inputs.target == 'aarch64-linux-android'
      working-directory: userspace/ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        source ../../.github/scripts/setup-rust-build.sh aarch64-linux-android 26
        cargo ndk -t arm64-v8a --platform 26 check --locked
        cargo ndk -t arm64-v8a --platform 26 clippy --locked -- -D warnings
        cargo fmt
        git diff --exit-code -- '*.rs'

    - name: Build ksud
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ -n "${{ inputs.manager_package }}" ]; then
          export KSU_PACKAGE_NAME="${{ inputs.manager_package }}"
        elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ inputs.use_pr_package }}" = "true" ]; then
          export KSU_PACKAGE_NAME="me.weishu.kernelsu.pr"
        fi
        echo "KSU_PACKAGE_NAME=${KSU_PACKAGE_NAME:-default}"
        source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
        cargo build --locked --target $TRIPLE --release --manifest-path ./userspace/ksud/Cargo.toml

    - name: Upload ksud artifact
      uses: actions/upload-artifact@v7
      with:
        name: ksud-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/ksud
