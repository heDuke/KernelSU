# HuskySU (Pixel 8 Pro) production release:
# - android14-6.1 + android16-6.12 LKM
# - Manager package me.weishu.kernelsu.husky.fork (HuskySU)
# - Signs with repo Secrets (KEYSTORE*) and publishes a GitHub Release
name: Husky LKM Release

# Manual only — auto push builds burned through Actions minutes on husky-lkm.
# Publish: Actions → Husky LKM Release → Run workflow (create_release as needed).
on:
  workflow_dispatch:
    inputs:
      ddk_release:
        description: 'DDK image tag (ghcr.io/ylarod/ddk-min)'
        required: false
        default: '20260313'
        type: string
      create_release:
        description: 'Create/update GitHub Release husky-v*'
        required: false
        default: true
        type: boolean

env:
  HUSKY_PACKAGE: me.weishu.kernelsu.husky.fork
  HUSKY_NAME: HuskySU

permissions:
  contents: write

jobs:
  prepare-signing:
    runs-on: ubuntu-latest
    outputs:
      expected_size: ${{ steps.extract.outputs.expected_size }}
      expected_hash: ${{ steps.extract.outputs.expected_hash }}
      version_name: ${{ steps.ver.outputs.version_name }}
      version_code: ${{ steps.ver.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require production keystore secrets
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Extract certificate size/hash
        id: extract
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > huskysu.jks
          keytool -exportcert -alias "$KEY_ALIAS" -keystore huskysu.jks \
            -storepass "$KEYSTORE_PASSWORD" -file cert.der
          SIZE_DEC=$(stat -c%s cert.der)
          SIZE_HEX=$(printf '0x%04x' "$SIZE_DEC")
          HASH=$(sha256sum cert.der | awk '{print $1}')
          echo "expected_size=$SIZE_HEX" >> "$GITHUB_OUTPUT"
          echo "expected_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE_HEX hash=$HASH"

      - name: Read manager version
        id: ver
        run: |
          # Matches manager/build.gradle.kts getVersionName/Code
          COUNT=$(git rev-list --count HEAD)
          VC=$((30000 + COUNT))
          VN=$(git describe --tags --always)
          echo "version_name=$VN" >> "$GITHUB_OUTPUT"
          echo "version_code=$VC" >> "$GITHUB_OUTPUT"
          echo "version $VN ($VC)"

  build-lkm:
    needs: prepare-signing
    strategy:
      matrix:
        # A17 OTA inactive slot on husky can be android16-6.12
        kmi: [android14-6.1, android16-6.12]
    uses: ./.github/workflows/ddk-lkm.yml
    with:
      kmi: ${{ matrix.kmi }}
      ddk_release: ${{ inputs.ddk_release || '20260313' }}
      # Primary production slot only — do NOT set SIZE2/HASH2 (that marks PR/non-production kernel)
      expected_size: ${{ needs.prepare-signing.outputs.expected_size }}
      expected_hash: ${{ needs.prepare-signing.outputs.expected_hash }}
      manager_package: me.weishu.kernelsu.husky.fork

  build-ksuinit:
    uses: ./.github/workflows/ksuinit.yml

  build-ksud:
    needs: [build-lkm, build-ksuinit]
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
    uses: ./.github/workflows/ksud.yml
    with:
      target: ${{ matrix.target }}
      pack_lkm: true
      pack_ksuinit: true
      manager_package: me.weishu.kernelsu.husky.fork

  build-manager:
    needs: [prepare-signing, build-ksud]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Write production signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > huskysu.jks
          {
            echo KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            echo KEY_ALIAS="$KEY_ALIAS"
            echo KEY_PASSWORD="$KEY_PASSWORD"
            echo KEYSTORE_FILE='huskysu.jks'
          } >> gradle.properties

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4

      - name: Download ARM64 ksud for JNI packaging
        uses: actions/download-artifact@v8
        with:
          name: ksud-aarch64-linux-android
          path: manager/app/src/main/jniLibs/arm64-v8a

      - name: Download x86_64 ksud for JNI packaging
        uses: actions/download-artifact@v8
        with:
          name: ksud-x86_64-linux-android
          path: manager/app/src/main/jniLibs/x86_64

      - name: Prepare required JNI binaries
        run: |
          mv app/src/main/jniLibs/arm64-v8a/ksud app/src/main/jniLibs/arm64-v8a/libksud.so
          mv app/src/main/jniLibs/x86_64/ksud app/src/main/jniLibs/x86_64/libksud.so
          test -s app/src/main/jniLibs/arm64-v8a/libksud.so
          test -s app/src/main/jniLibs/x86_64/libksud.so

      - name: Assemble HuskySU release
        run: |
          ./gradlew clean assembleRelease testDebugUnitTest \
            -PKSU_PACKAGE_NAME=me.weishu.kernelsu.husky.fork \
            -PKSU_NAME=HuskySU

      - name: Upload production Manager test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: husky-manager-unit-tests
          path: manager/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: manager-gradle
          path: manager/app/build/outputs/apk/release/*.apk

  repack-and-release:
    needs: [build-manager, build-ksud, prepare-signing]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: android-actions/setup-android@v4

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place manager apk and ksud
        run: |
          mkdir -p manager/app/build/outputs/apk/release
          APK=$(find artifacts/manager-gradle -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp -f "$APK" manager/app/build/outputs/apk/release/

          mkdir -p target/aarch64-linux-android/release target/x86_64-linux-android/release
          ARM64_KSUD=$(find artifacts/ksud-aarch64-linux-android -type f -name ksud | head -n 1)
          X86_KSUD=$(find artifacts/ksud-x86_64-linux-android -type f -name ksud | head -n 1)
          test -n "$ARM64_KSUD" && test -n "$X86_KSUD"
          cp -f "$ARM64_KSUD" target/aarch64-linux-android/release/ksud
          cp -f "$X86_KSUD" target/x86_64-linux-android/release/ksud

          mkdir -p dist-lkm
          for kmi in android14-6.1 android16-6.12; do
            KO=$(find artifacts/aarch64-$kmi-lkm -type f -name '*.ko' | head -n 1)
            test -n "$KO"
            cp -f "$KO" "dist-lkm/${kmi}_kernelsu.ko"
          done

      - name: Repack and sign HuskySU
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > huskysu.jks
          pip install -q protobuf
          python3 repack_apk.py repack \
            -b release -t release \
            -a arm64-v8a -a x86_64 \
            -K huskysu.jks -A "$KEY_ALIAS" \
            -P "$KEYSTORE_PASSWORD" -S "$KEY_PASSWORD" \
            --strip
          mkdir -p dist-husky
          APK=$(find dist -name '*.apk' | head -n 1)
          cp -f "$APK" dist-husky/HuskySU.apk
          cp -f dist-lkm/*_kernelsu.ko dist-husky/
          ls -la dist-husky

      - name: Verify production APK and write manifest
        env:
          EXPECTED_CERTIFICATE: ${{ needs.prepare-signing.outputs.expected_hash }}
          EXPECTED_VERSION_CODE: ${{ needs.prepare-signing.outputs.version_code }}
        run: |
          python3 -m unittest discover -s scripts/tests -p test_husky_release.py
          python3 scripts/verify_husky_release.py dist-husky

      - uses: actions/upload-artifact@v7
        with:
          name: husky-release
          path: dist-husky/*

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VN: ${{ needs.prepare-signing.outputs.version_name }}
          VC: ${{ needs.prepare-signing.outputs.version_code }}
        run: |
          TAG="husky-v${VC}"
          # Avoid collision on re-run
          if gh release view "$TAG" >/dev/null 2>&1; then
            TAG="husky-v${VC}-${GITHUB_SHA::7}"
          fi
          TITLE="HuskySU ${VN} (${VC})"
          cat > release-notes.md <<EOF
          ## HuskySU (Pixel 8 Pro / husky)

          - App: **HuskySU**
          - Package: \`me.weishu.kernelsu.husky.fork\`
          - KMI: \`android14-6.1\` + \`android16-6.12\` (OTA inactive slot)
          - Assets: \`HuskySU.apk\`, \`android14-6.1_kernelsu.ko\`, \`android16-6.12_kernelsu.ko\`
          - Changes: native Material 3 Expressive controls, accessibility fixes and GKI-independent UI eligibility
          - Fix: independent Manager/driver build numbers are distinct from interface incompatibility; LKM updates require verified exact kernel release, KMI and page-size metadata
          - Production package/certificate verified; manifest and SHA256SUMS included
          - Generic LKM builds require exact target validation. They are not the pinned ZP11.260918.007 / 6.1.172 Canary candidate.
          - Canary private-ABI/CFI, cold-boot/recovery and full visual acceptance remain incomplete. Independent experimental loading remains disabled.

          Based on [KernelSU](https://github.com/tiann/KernelSU). See docs/README Credits.

          Commit: \`${GITHUB_SHA}\`
          EOF
          gh release create "$TAG" \
            dist-husky/HuskySU.apk \
            dist-husky/android14-6.1_kernelsu.ko \
            dist-husky/android16-6.12_kernelsu.ko \
            dist-husky/manifest.json \
            dist-husky/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file release-notes.md
          echo "Released $TAG"
